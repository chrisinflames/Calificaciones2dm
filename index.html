<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Calificaciones</title>
<style>
* { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
Roboto, Arial, sans-serif; }

body { margin: 0; padding: 20px 15px; background-color: #f0f2f5; display: flex; flex-
direction: column; align-items: center; min-height: 100vh; }

.logo-container { margin-bottom: 20px; text-align: center; }
.logo-container img { max-width: 180px; border-radius: 8px; }
.main-card { background: #ffffff; width: 100%; max-width: 420px; border-radius: 14px;
padding: 24px 20px; border: 1px solid #e2e8f0; }

h1 { font-size: 1.25rem; color: #1f2937; text-align: center; margin: 0 0 18px 0; line-
height: 1.35; }

input[type="text"] { width: 100%; padding: 13px 14px; font-size: 1rem; border: 1px solid
#d1d5db; border-radius: 8px; margin-bottom: 14px; outline: none; }
input[type="text"]:focus { border-color: #1d6ce0; }
button { width: 100%; padding: 13px; font-size: 1rem; font-weight: 600; color: #ffffff;
background-color: #1d6ce0; border: none; border-radius: 8px; cursor: pointer; }
button:disabled { background-color: #93c5fd; }
.alerta { margin-top: 16px; padding: 14px; background-color: #e5e7eb; color: #374151;
border-radius: 8px; text-align: center; font-size: 0.95rem; display: none; }
.tarjeta-resultado { margin-top: 18px; background-color: #d9f2fa; border: 1px solid
#bae6fd; border-radius: 10px; padding: 18px 16px; color: #1f2937; display: none; }
.nombre-alumno { color: #0277bd; font-weight: 700; font-size: 1.05rem; text-align:
center; text-transform: uppercase; margin-bottom: 14px; line-height: 1.3; }
.dato-linea { font-size: 0.95rem; margin-bottom: 9px; line-height: 1.4; color: #263238;
}
.dato-calificacion { margin-top: 14px; padding-top: 10px; border-top: 1px solid #b3e5fc;
font-size: 1.05rem; color: #0277bd; }
</style>
</head>
<body>
<div class="logo-container"><img src="logo.png" alt="Logo Escuela"></div>
<div class="main-card">
<h1>Consulta de Calificaciones por Código</h1>
<input type="text" id="inputCodigo" placeholder="Ingresa tu código de alumno"
autocomplete="off">
<button id="btnBuscar" onclick="buscarAlumno()">Buscar</button>
<div id="mensajeAlerta" class="alerta"></div>
<div id="tarjetaResultado" class="tarjeta-resultado">
<div class="nombre-alumno" id="resNombre"></div>
<div class="dato-linea"><strong>Grado:</strong> <span id="resGrado"></span></div>
<div class="dato-linea"><strong>Grupo:</strong> <span id="resGrupo"></span></div>
<div class="dato-linea"><strong>Turno:</strong> <span id="resTurno"></span></div>
<div class="dato-linea dato-calificacion"><strong>Calificación:</strong> <span
id="resCalificacion"></span></div>
</div>
</div>
<script>

});

</body>
</html>
